name: Aktualizacja kalendarza

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rdxiii_calendar/**"
      - "config/**"
      - "tests/**"
      - "generate_calendar.py"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"
  schedule:
    # Dwa uruchomienia pokrywają czas letni i zimowy w Warszawie.
    # Oba naprawdę wykonują generator; stabilny ICS zapobiega zbędnym commitom.
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Narzędzia OCR
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-pol
      - name: Zależności
        run: pip install -r requirements.txt pytest
      - name: Testy
        run: python -m pytest -q
      - name: Generowanie kalendarza
        run: python generate_calendar.py
      - name: Zapis aktualizacji
        run: |
          git config user.name "rdxiii-calendar[bot]"
          git config user.email "rdxiii-calendar[bot]@users.noreply.github.com"
          git add docs/komisje-rd-xiii.ics
          git diff --cached --quiet || git commit -m "Aktualizacja kalendarza"
          git push
